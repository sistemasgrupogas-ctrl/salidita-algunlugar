<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 ¿Nos vamos de fiesta?</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
       
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #4f46e5);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .screen {
            padding: 30px 25px;
            text-align: center;
            min-height: 460px;
            display: none;
        }
        .screen.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        h1 { color: #4f46e5; margin-bottom: 20px; }
        .btn {
            padding: 16px 30px;
            margin: 12px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-yes { background: #22c55e; color: white; }
        .btn-no { background: #ef4444; color: white; position: relative; }
        
        .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
        .option-btn { min-height: 66px; overflow-wrap: anywhere; }
        .option-btn:focus-visible, .btn:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
        .hint { color: #64748b; font-size: 14px; margin-top: -8px; }
        @media (max-width: 380px) {
            .screen { padding: 24px 16px; }
            .options { grid-template-columns: 1fr; }
            .btn { margin: 8px 4px; }
        }
        .option-btn {
            padding: 16px;
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 16px;
            cursor: pointer;
        }
        .option-btn:hover {
            background: #4f46e5;
            color: white;
            transform: scale(1.05);
        }
        input[type="date"], input[type="time"] {
            padding: 12px; font-size: 16px; border-radius: 10px;
            border: 1px solid #cbd5e1; margin: 15px 0; width: 80%;
        }
        .final {
            background: #f0fdf4;
            border: 3px solid #22c55e;
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            font-size: 19px;
            line-height: 1.8;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="screen active" id="screen1">
            <h1> ¿Quieres que salgamos por ahi?</h1>
            <button class="btn btn-yes" onclick="acceptInvite()">¡SÍ, CLARO! ❤️</button>
            <button class="btn btn-no" id="noBtn">No</button>
        </div>

        <div class="screen" id="screen2">
            <h1>¡Genial! 🎉</h1>
            <p style="font-size:18px; margin:20px 0;">¿A dónde quieres ir?</p>
            <div class="options" id="places"></div>
        </div>

        <div class="screen" id="screenCine">
            <h1 id="detailTitle">✨ Elige una opción</h1>
            <p id="detailSubtitle">Hay muchas posibilidades...</p>
            <div class="options" id="movies"></div>
            <button class="btn btn-yes" onclick="backToPlaces()">← Volver</button>
        </div>

        <div class="screen" id="screen3">
            <h1>¿Qué día? 📅</h1>
            <input type="date" id="dateInput">
            <br>
            <button class="btn btn-yes" onclick="selectDate()">Continuar →</button>
        </div>

        <div class="screen" id="screen4">
            <h1>¿A qué hora? ⏰</h1>
            <input type="time" id="timeInput">
            <br>
            <button class="btn btn-yes" onclick="finish()">¡Confirmar cita! ❤️</button>
        </div>

        <div class="screen" id="screen5">
            <h1>¡Cita Confirmada! 🎊</h1>
            <div class="final" id="finalMessage"></div>
            <p style="color:#22c55e; margin-top:15px;">Enviando...</p>
        </div>

    </div>

    <script>

                "🎯 Ganar premios", "🏆 Competencia de puntos"],

            "🌌 Ver las estrellas": ["🌌 Buscar un lugar tranquilo", "🧺 Llevar una manta",
                "✨ Identificar constelaciones", "🎶 Música y conversación"],
            "🚶 Paseo nocturno": ["🌃 Caminar por un lugar bonito", "🍦 Comprar algo",
                "🎶 Paseo con música", "📸 Fotos nocturnas"],
            "🐾 Zoológico": ["🦁 Ver animales", "🦋 Mariposario", "📸 Tomar fotografías",
                "🚶 Recorrer todo con calma"],
            "🌿 Jardín botánico": ["🌺 Recorrer los jardines", "📸 Fotografías",
                "🌳 Buscar el rincón más bonito", "🧺 Paseo y picnic"],
            "🎡 Feria o juegos": ["🎡 Juegos mecánicos", "🎯 Juegos de destreza",
                "🍭 Antojitos", "🎁 Intentar ganar un premio"],
            "🎭 Teatro": ["😂 Comedia", "🎭 Obra dramática", "🎶 Musical",
                "🎟️ La función que más te guste"],
            "🎶 Concierto": ["🎸 Rock", "🎤 Pop", "🎶 Música romántica",
                "🎧 Música en vivo", "✨ El artista que tú elijas"],
            "🏖️ Alberca": ["🏊 Nadar", "☀️ Pasar la tarde", "🥤 Bebidas y descanso",
                "🎶 Música y alberca"],
            "🏕️ Aventura al aire libre": ["🥾 Senderismo", "🚴 Paseo en bicicleta",
                "🌄 Explorar un lugar nuevo", "📸 Aventura y fotografías"],
            "🏠 Plan en casa": ["🍿 Película y snacks", "🍕 Pedir comida",
                "🎮 Videojuegos", "🍳 Cocinar juntos", "🎲 Juegos de mesa",
                "🎶 Música y plática"],
            "🚗 Salir a dar una vuelta": ["🌃 Manejar sin prisa", "🌅 Ver el atardecer",
                "☕ Buscar un café", "🎶 Música y carretera"],
            "🎁 Tú eliges por mí": ["🎁 Sorpréndeme", "❤️ Algo romántico",
                "😂 Algo divertido", "✨ Algo que nunca hayamos hecho"]
        };

        const movies = [
            "Atrápelo quien pueda", "Ebenezer: Los fantasmas de Navidad",
            "Yo soy Rocky", "Godzilla Minus Zero", "La venganza del Charro Negro",
            "El gato con sombrero", "Una película de acción", "Una comedia romántica",
            "Una película de terror", "Una de ciencia ficción", "Una de suspenso",
            "Una película animada", "Una película de superhéroes",
            "Una película clásica", "La que esté de estreno",
            "La que tú quieras ❤️", "Elegirla juntos en el cine"
        ];

        // ===DATOS
        emailjs.init("TKf1yj0BW9Cz7EXTI");
        const SERVICE_ID = "service_ncbsyow";
        const TEMPLATE_ID = "template_y6uyerb";
        // ========

        const noBtn = document.getElementById('noBtn');
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 100);
            noBtn.style.position = 'absolute';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        function acceptInvite() {
            document.getElementById('screen1').classList.remove('active');
            document.getElementById('screen2').classList.add('active');
            loadPlaces();
        }

        function loadPlaces() {
            const placesDiv = document.getElementById('places');
            placesDiv.innerHTML = '';
            places.forEach(place => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = place;
                btn.onclick = () => selectPlace(place);
                placesDiv.appendChild(btn);
            });
        }

        function selectPlace(place) {
            selectedPlace = place;
            selectedMovie = "";
            selectedDetail = "";
            const options = place.includes("🎥") ? movies : (detailOptions[place] || ["✨ Elegir juntos"]);
            const title = document.getElementById('detailTitle');
            title.textContent = place.includes("🎥") ? "🎥 Elige la película" : "✨ Personaliza el plan";
            document.getElementById('detailSubtitle').textContent =
                place.includes("🎥") ? "También puedes elegir el género o decidirlo juntos." : "¿Qué te gustaría hacer?";
            document.getElementById('screen2').classList.remove('active');
            document.getElementById('screenCine').classList.add('active');
            loadMovies(options);
        }

        function loadMovies(options = movies) {
            const moviesDiv = document.getElementById('movies');
            moviesDiv.innerHTML = '';
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => {
                    if (selectedPlace.includes("🎥")) {
                        selectedMovie = option;
                    } else {
                        selectedDetail = option;
                    }
                    document.getElementById('screenCine').classList.remove('active');
                    document.getElementById('screen3').classList.add('active');
                };
                moviesDiv.appendChild(btn);
            });
        }

        function backToPlaces() {
            document.getElementById('screenCine').classList.remove('active');
            document.getElementById('screen2').classList.add('active');
        }

        function selectDate() {
            if (!document.getElementById('dateInput').value) return alert("Elige una fecha ❤️");
            document.getElementById('screen3').classList.remove('active');
            document.getElementById('screen4').classList.add('active');
        }

        function finish() {
            const date = document.getElementById('dateInput').value;
            const time = document.getElementById('timeInput').value;
            if (!time) return alert("Elige una hora por favor");

            let lugar = selectedPlace;
            if (selectedMovie) lugar += ` - ${selectedMovie}`;
            if (selectedDetail) lugar += ` - ${selectedDetail}`;

            const mensajeHTML = `
                ¡Cita Confirmada! ❤️<br><br>
                📍 Lugar: <strong>${lugar}</strong><br>
                📅 Fecha: ${new Date(date).toLocaleDateString('es-ES')}<br>
                ⏰ Hora: ${time} hs<br><br>
                ¡Te veo ahí! 🥰
            `;

            document.getElementById('finalMessage').innerHTML = mensajeHTML;
            document.getElementById('screen4').classList.remove('active');
            document.getElementById('screen5').classList.add('active');

            // Confeti
            launchConfetti();

            // Enviar Email
            emailjs.send(SERVICE_ID, TEMPLATE_ID, {
                lugar: lugar,
                pelicula: selectedMovie || "No aplica",
                detalle: selectedDetail || "No aplica",
                fecha: new Date(date).toLocaleDateString('es-ES'),
                hora: time
            });
        }

        function launchConfetti() {
            const duration = 5000;
            const end = Date.now() + duration;
            const interval = setInterval(() => {
                confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
                if (Date.now() > end) clearInterval(interval);
            }, 300);
        }

        function restart() {
            location.reload();
        }
    </script>
</body>
</html>
